name: 每日台股篩選

on:
  schedule:
    # GitHub 排程用 UTC。09:30 UTC = 台北 17:30；11:30 UTC = 台北 19:30（補跑，若 17:30 時資料尚未齊全）
    - cron: "30 9 * * 1-5"
    - cron: "30 11 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "指定日期 YYYY-MM-DD（留空 = 今天）"
        required: false
      latest:
        description: "用最近一個交易日重算（儀表板儲存設定後會自動勾選）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-screen
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 抓資料並篩選
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python -m src.main --date "${{ github.event.inputs.date }}"
          elif [ "${{ github.event.inputs.latest }}" = "true" ]; then
            python -m src.main --latest
          else
            python -m src.main
          fi

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data
          if git diff --cached --quiet; then
            echo "沒有新資料"
          else
            git commit -m "資料更新 $(TZ=Asia/Taipei date +%F)"
            git pull --rebase origin main   # 執行期間若儀表板又存了設定，先合併再推
            git push
          fi
